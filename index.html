<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EHBEA YouTube Videos</title>
  <style>
    body { margin: 0; padding: 0; background: linear-gradient(135deg, #f5f7fa 0%, #e8f4f5 100%); }
    .youtube-widget { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 100%; margin: 1.5rem auto; padding: 0 1rem; }
    .video-section { margin-bottom: 1.5rem; overflow: hidden; }
    .section-heading { color: #4CB3B9; font-size: 1.5rem; margin: 0 auto 1rem; font-weight: 600; border-bottom: 3px solid #4CB3B9; padding: 0 1rem 0.4rem; max-width: 1200px; }
    .videos-scroll-container { position: relative; width: 100%; overflow: hidden; padding: 0.5rem 0; }
    .videos-track { display: flex; gap: 1.5rem; animation: scroll-left 60s linear infinite; width: fit-content; }
    .videos-track:hover { animation-play-state: paused; }
    @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .video-card { flex: 0 0 320px; background: #fff; border: 1px solid #e6e6e6; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.05); transition: transform .2s ease, box-shadow .2s ease; cursor: pointer; }
    .video-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }
    .video-thumbnail { position: relative; padding-bottom: 56.25%; background: #000; }
    .video-thumbnail img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .play-button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 68px; height: 48px; background: rgba(76,179,185,.9); border-radius: 12px; transition: background .2s ease; }
    .video-card:hover .play-button { background: rgba(76,179,185,1); }
    .play-button::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-40%, -50%); width: 0; height: 0; border-style: solid; border-width: 10px 0 10px 18px; border-color: transparent transparent transparent #fff; }
    .video-info { padding: .75rem 1rem; }
    .video-title { font-weight: 600; color: #0a2239; margin: 0 0 .4rem; font-size: 1rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video-date { color: #666; font-size: .85rem; margin: 0; }
    .loading { text-align: center; padding: 2rem; color: #666; }
    .error { text-align: center; padding: 2rem; color: #e74c3c; }
    .video-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.9); z-index: 1000; padding: 2rem; box-sizing: border-box; }
    .video-modal.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { width: 100%; max-width: 1000px; position: relative; }
    .modal-iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 8px; }
    .close-modal { position: absolute; top: -40px; right: 0; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; padding: 0; width: 40px; height: 40px; }
    .close-modal:hover { color: #4CB3B9; }
    @media (max-width: 768px) { .video-card { flex: 0 0 280px; } .video-modal { padding: 1rem; } }
  </style>
</head>
<body>
  <section class="youtube-widget">
    <div class="video-section">
      <h2 class="section-heading">Latest Videos from EHBEA</h2>
      <div class="videos-scroll-container">
        <div id="channel-videos-track" class="videos-track"><div class="loading">Loading videos...</div></div>
      </div>
    </div>

    <div class="video-section">
      <h2 class="section-heading">Plenaries from Previous Years</h2>
      <div class="videos-scroll-container">
        <div id="playlist-videos-track" class="videos-track"><div class="loading">Loading videos...</div></div>
      </div>
    </div>
  </section>

  <div id="video-modal" class="video-modal">
    <div class="modal-content">
      <button class="close-modal" id="close-modal" aria-label="Close">&times;</button>
      <iframe id="modal-iframe" class="modal-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // Paste your key here and restrict it in Google Cloud Console
    // (HTTP referrers = your site only; API = YouTube Data API v3 only).
    const API_KEY = 'AIzaSyDQ2SFSUJ8sJHeQMFWRPFiaNqLKjNZ8xZo';

    // Channel: youtube.com/@ehbea_official
    const CHANNEL_ID = 'UC4JiSSnc1LV3xpWUY09Pm3w';
    // Every channel has an "uploads" playlist: the channel ID with UC -> UU.
    // playlistItems costs 1 quota unit per call (search costs 100).
    const UPLOADS_PLAYLIST_ID = 'UU' + CHANNEL_ID.slice(2);
    const PLAYLIST_ID = 'PL-rTMAj5qryI2jTKzI59r-m9zS8j6i_rz';

    const CHANNEL_MAX_RESULTS = 8;
    const PLAYLIST_MAX_RESULTS = 12;

    function esc(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function fetchPlaylist(playlistId, max) {
      try {
        let videos = [];
        let pageToken = '';
        do {
          const url = `https://www.googleapis.com/youtube/v3/playlistItems?key=${API_KEY}&playlistId=${playlistId}&part=snippet&maxResults=50${pageToken ? `&pageToken=${pageToken}` : ''}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const page = (data.items || [])
            .filter(i => i.snippet && i.snippet.thumbnails && i.snippet.resourceId
              && !['Private video', 'Deleted video'].includes(i.snippet.title))
            .map(i => {
              const t = i.snippet.thumbnails;
              return {
                videoId: i.snippet.resourceId.videoId,
                title: i.snippet.title,
                thumbnail: (t.medium || t.default || t.high).url,
                publishedAt: i.snippet.publishedAt
              };
            });
          videos = videos.concat(page);
          pageToken = data.nextPageToken || '';
        } while (pageToken && videos.length < max);
        return videos.slice(0, max);
      } catch (err) {
        console.error('Error fetching playlist', playlistId, err);
        return [];
      }
    }

    function displayVideos(container, videos) {
      if (!videos.length) {
        container.innerHTML = '<div class="error">No videos found.</div>';
        return;
      }
      const html = videos.map(v => {
        const date = new Date(v.publishedAt).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
        return `
          <article class="video-card" data-video-id="${esc(v.videoId)}">
            <div class="video-thumbnail">
              <img src="${esc(v.thumbnail)}" alt="${esc(v.title)}" loading="lazy">
              <div class="play-button"></div>
            </div>
            <div class="video-info">
              <h3 class="video-title">${esc(v.title)}</h3>
              <p class="video-date">${date}</p>
            </div>
          </article>`;
      }).join('');
      // Repeat short lists so wide screens never show a gap, then duplicate for the seamless loop.
      const set = videos.length < 8 ? html + html : html;
      container.innerHTML = set + set;
    }

    function openVideoModal(id) {
      document.getElementById('modal-iframe').src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1`;
      document.getElementById('video-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeVideoModal() {
      document.getElementById('modal-iframe').src = '';
      document.getElementById('video-modal').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    document.addEventListener('click', e => {
      const card = e.target.closest('.video-card');
      if (card) openVideoModal(card.dataset.videoId);
    });
    document.getElementById('close-modal').addEventListener('click', closeVideoModal);
    document.getElementById('video-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeVideoModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideoModal(); });

    (async function init() {
      const [latest, previous] = await Promise.all([
        fetchPlaylist(UPLOADS_PLAYLIST_ID, CHANNEL_MAX_RESULTS),
        fetchPlaylist(PLAYLIST_ID, PLAYLIST_MAX_RESULTS)
      ]);
      displayVideos(document.getElementById('channel-videos-track'), latest);
      displayVideos(document.getElementById('playlist-videos-track'), previous);
    })();
  </script>
</body>
</html>
